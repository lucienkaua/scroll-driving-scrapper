<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #191815;
    --bg-top: #221f1a;
    --panel: #211f1b;
    --panel-2: #272420;
    --line: #35322b;
    --line-2: #514c40;
    --ink: #ede9e0;
    --muted: #9a947f;
    --rec: #f5483e;
    --rec-soft: rgba(245, 72, 62, .16);
    --mono: "Cascadia Code", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    width: 340px; margin: 0; padding: 14px;
    background: radial-gradient(130% 70% at 50% -16%, var(--bg-top), transparent 62%), var(--bg);
    color: var(--ink);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
  }

  header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--rec); flex: none;
    box-shadow: 0 0 6px var(--rec-soft);
  }
  .dot.live { animation: pulse 1.1s ease-in-out infinite; box-shadow: 0 0 10px var(--rec); }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { font: 700 12px var(--mono); letter-spacing: .18em; margin: 0; flex: 1; }
  .ver {
    font: 10px var(--mono); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
  }

  #stack { display: flex; flex-wrap: wrap; gap: 4px; min-height: 18px; margin-bottom: 10px; }
  #stack span {
    font: 9px var(--mono); letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px;
    animation: badge-in .25s ease backwards;
    animation-delay: calc(var(--i, 0) * 45ms);
    transition: color .12s ease, border-color .12s ease, transform .12s ease;
  }
  #stack span:hover { color: var(--ink); border-color: var(--line-2); transform: translateY(-1px); }
  @keyframes badge-in { from { opacity: 0; transform: translateY(4px); } }

  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  button, select {
    font: 12px var(--mono); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 10px; cursor: pointer;
    transition: transform .13s ease, border-color .13s ease, box-shadow .13s ease,
                filter .13s ease, background .13s ease;
  }
  button:hover:not(:disabled), select:hover:not(:disabled) {
    border-color: var(--line-2); background-color: var(--panel-2); transform: translateY(-1px);
  }
  button:active:not(:disabled) { transform: translateY(0) scale(.98); transition-duration: .08s; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--rec); outline-offset: 1px; }
  button:disabled { opacity: .45; cursor: default; }
  button svg { width: 12px; height: 12px; flex: none; }

  #sample {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 600;
  }
  #sample:hover:not(:disabled) {
    background: var(--rec); border-color: var(--rec);
    filter: brightness(1.1); box-shadow: 0 4px 18px var(--rec-soft);
  }
  #sampleDot { width: 8px; height: 8px; border-radius: 50%; background: #fff; flex: none; }
  #sample.busy #sampleDot { animation: pulse 1.1s ease-in-out infinite; }
  #css { flex: 1; }
  #dur {
    width: 82px;
    appearance: none; -webkit-appearance: none;
    padding: 9px 24px 9px 12px;
    background-color: var(--panel);
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="5" viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" fill="none" stroke="%239a947f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    background-repeat: no-repeat;
    background-position: right 9px center;
  }
  select option { background: var(--panel); color: var(--ink); }

  .ruler-wrap { position: relative; margin-bottom: 6px; }
  #ruler {
    display: block; width: 100%; height: 34px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    transition: border-color .13s ease;
  }
  .ruler-wrap:hover #ruler { border-color: var(--line-2); }
  .ruler-label {
    position: absolute; right: 7px; top: 5px;
    font: 9px var(--mono); letter-spacing: .08em; color: var(--muted);
    text-transform: uppercase; pointer-events: none;
  }
  .ruler-label.rec { color: var(--rec); }

  #status { font: 11px var(--mono); color: var(--muted); min-height: 30px; margin: 0 0 8px; }
  #status b { color: var(--ink); font-weight: 600; }

  textarea {
    width: 100%; height: 150px; resize: vertical;
    font: 10.5px/1.4 var(--mono); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px;
    transition: border-color .13s ease;
  }
  textarea:hover { border-color: var(--line-2); }
  textarea:focus-visible { outline: 2px solid var(--rec); outline-offset: 1px; }
  textarea::-webkit-scrollbar { width: 10px; }
  textarea::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  textarea::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

  footer { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  footer button { display: flex; align-items: center; gap: 6px; }
  #copy.ok { color: var(--rec); border-color: var(--rec); }
  #size { margin-left: auto; font: 10px var(--mono); color: var(--muted); }

  .credit {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
    font: 10px var(--mono); letter-spacing: .04em;
    color: var(--muted); text-decoration: none;
    transition: color .13s ease;
  }
  .credit b { color: var(--ink); font-weight: 600; transition: color .13s ease; }
  .credit svg { width: 12px; height: 12px; fill: var(--muted); transition: fill .13s ease; }
  .credit:hover { color: var(--ink); }
  .credit:hover b { color: var(--rec); }
  .credit:hover svg { fill: var(--rec); }
  .credit:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header>
    <div class="dot" id="dot"></div>
    <h1>SFX CLONE</h1>
    <span class="ver">v1.7</span>
  </header>
  <div id="stack" title="Bibliotecas detectadas na página"></div>
  <div class="row">
    <button id="sample"><span id="sampleDot"></span><span id="sampleLabel">Capturar rolagem</span></button>
    <select id="dur" title="Duração da gravação — Auto escala com a altura da página (~1200 px/s, entre 8s e 35s)">
      <option value="auto" selected>Auto</option>
      <option value="12000">12s</option>
      <option value="20000">20s</option>
      <option value="35000">35s</option>
    </select>
  </div>
  <div class="row">
    <button id="css">Extrair CSS nativo (scroll-timeline)</button>
  </div>
  <div class="ruler-wrap">
    <canvas id="ruler" width="312" height="34"></canvas>
    <span class="ruler-label" id="rulerLabel">timeline</span>
  </div>
  <p id="status">Abra a página alvo e clique em <b>Capturar rolagem</b>.</p>
  <textarea id="out" readonly spellcheck="false" placeholder="O bundle .js aparece aqui depois da captura."></textarea>
  <footer>
    <button id="copy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg><span id="copyLabel">Copiar</span></button>
    <button id="dl"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0 3-3M8 10 5 7"/><path d="M2 11v1.5A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5V11"/></svg>Baixar .js</button>
    <span id="size"></span>
  </footer>
  <a class="credit" href="https://github.com/lucienkaua" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    Desenvolvido por <b>lucienkaua</b>
  </a>
<script src="popup.js"></script>
</body>
</html>
