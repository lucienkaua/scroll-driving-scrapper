<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #191815;
    --panel: #211f1b;
    --line: #35322b;
    --ink: #ede9e0;
    --muted: #9a947f;
    --rec: #f5483e;
    --rec-ink: #ffd9d6;
    --mono: "Cascadia Code", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; padding: 14px;
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); flex: none; }
  .dot.live { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
  h1 { font: 700 12px var(--mono); letter-spacing: .18em; margin: 0; flex: 1; }
  .ver { font: 10px var(--mono); color: var(--muted); }

  #stack { display: flex; flex-wrap: wrap; gap: 4px; min-height: 18px; margin-bottom: 10px; }
  #stack span {
    font: 9px var(--mono); letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px;
  }

  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  button, select {
    font: 12px var(--mono); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--rec); outline-offset: 1px; }
  button:disabled { opacity: .45; cursor: default; }
  #sample { flex: 1; background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 600; }
  #sample:hover:not(:disabled) { filter: brightness(1.08); }
  #css { flex: 1; }
  #dur { width: 62px; text-align: center; }

  #ruler { display: block; width: 100%; height: 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; }
  #status { font: 11px var(--mono); color: var(--muted); min-height: 30px; margin: 0 0 8px; }
  #status b { color: var(--ink); font-weight: 600; }

  textarea {
    width: 100%; height: 150px; resize: vertical;
    font: 10.5px/1.4 var(--mono); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  }
  textarea:focus-visible { outline: 2px solid var(--rec); outline-offset: 1px; }
  footer { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  #size { margin-left: auto; font: 10px var(--mono); color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="dot" id="dot"></div>
    <h1>SFX CLONE</h1>
    <span class="ver">v1.1</span>
  </header>
  <div id="stack" title="Bibliotecas detectadas na página"></div>
  <div class="row">
    <button id="sample">&#9679; Capturar rolagem</button>
    <select id="dur" title="Duração da gravação">
      <option value="4000">4s</option>
      <option value="8000" selected>8s</option>
      <option value="12000">12s</option>
    </select>
  </div>
  <div class="row">
    <button id="css">Extrair CSS nativo (scroll-timeline)</button>
  </div>
  <canvas id="ruler" width="312" height="30"></canvas>
  <p id="status">Abra a página alvo e clique em <b>Capturar rolagem</b>.</p>
  <textarea id="out" readonly spellcheck="false" placeholder="O bundle .js aparece aqui depois da captura."></textarea>
  <footer>
    <button id="copy">Copiar</button>
    <button id="dl">Baixar scrollfx.bundle.js</button>
    <span id="size"></span>
  </footer>
<script src="popup.js"></script>
</body>
</html>
