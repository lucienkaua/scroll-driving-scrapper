<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#c0369b"/>
      <stop offset="1" stop-color="#f5483e"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.72" cy="0.2" r="1.1">
      <stop offset="0" stop-color="#2b1d42"/>
      <stop offset="0.55" stop-color="#1c1526"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <radialGradient id="dotglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5483e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5483e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#4a3568" stroke-width="2" opacity="0.6"/>
  <!-- regua de keyframes ao fundo -->
  <g stroke="#5b4a7a" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <path d="M24 108v-7"/><path d="M44 108v-11"/><path d="M64 108v-7"/><path d="M84 108v-11"/><path d="M104 108v-7"/>
  </g>
  <!-- curva de scroll gravada -->
  <path d="M26 92 C 66 92, 52 34, 94 32" fill="none" stroke="url(#curve)"
        stroke-width="15" stroke-linecap="round"/>
  <!-- dot REC no fim da curva -->
  <circle cx="97" cy="32" r="30" fill="url(#dotglow)"/>
  <circle cx="97" cy="32" r="12.5" fill="#f5483e"/>
  <circle cx="97" cy="32" r="12.5" fill="none" stroke="#ffd9d6" stroke-width="2" opacity="0.5"/>
</svg>
